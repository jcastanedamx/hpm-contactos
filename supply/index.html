<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Andrea Olmos | Hudson Products de México</title>

  <meta name="description" content="Tarjeta de presentación digital de Andrea Olmos, Sr Supply Chain Manager en Hudson Products de México.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(135deg, #eef2f6 0%, #ffffff 50%, #e7edf3 100%);
      color: #0b2f5b;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 26px;
      overflow: hidden;
      box-shadow:
        0 20px 50px rgba(0, 40, 85, 0.15),
        0 4px 12px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      padding: 28px 24px 10px;
    }

    .logo {
      width: 230px;
      max-width: 85%;
      height: auto;
      margin-bottom: 20px;
    }

    .photo-container {
      width: 260px;
      height: 290px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
    }

    .photo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
    }

    .identity {
      margin-top: -8px;
      padding: 30px 20px 28px;
      text-align: center;
      color: #ffffff;
      background: linear-gradient(
        135deg,
        #064f9e 0%,
        #0068bd 55%,
        #0b3b78 100%
      );
      border-radius: 28px 28px 0 0;
    }

    .identity h1 {
      font-size: 30px;
      line-height: 1.2;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .identity p {
      font-size: 18px;
      font-weight: 400;
      opacity: 0.95;
    }

    .accent {
      width: 66px;
      height: 4px;
      background: #55c9ee;
      border-radius: 8px;
      margin: 18px auto 0;
    }

    .contact-list {
      padding: 8px 24px 10px;
      background: #ffffff;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 86px;
      padding: 14px 2px;
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid #dce4ec;
      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .contact-item:last-child {
      border-bottom: none;
    }

    .contact-item:hover {
      background: #f4f8fc;
    }

    .contact-item:active {
      transform: scale(0.99);
    }

    .icon {
      flex: 0 0 58px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #005baa, #07396f);
      color: #ffffff;
    }

    .icon svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .contact-text {
      flex: 1;
      min-width: 0;
    }

    .label {
      display: block;
      margin-bottom: 3px;
      font-size: 14px;
      color: #65768a;
    }

    .value {
      display: block;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      color: #102f57;
      word-break: break-word;
    }

    .arrow {
      font-size: 30px;
      font-weight: 300;
      color: #476987;
    }

    .actions {
      padding: 10px 24px 24px;
    }

    .save-contact {
      display: block;
      width: 100%;
      padding: 15px 18px;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #064f9e, #0068bd);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0, 91, 170, 0.2);
    }

    .save-contact:hover {
      opacity: 0.94;
    }

    .footer {
      text-align: center;
      padding: 22px 20px 26px;
      background: #f5f8fb;
      border-top: 1px solid #e4eaf0;
    }

    .footer-text {
      font-size: 18px;
      font-style: italic;
      color: #0b3b78;
      letter-spacing: 0.2px;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        align-items: flex-start;
        background: #ffffff;
      }

      .card {
        max-width: none;
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }

      .header {
        padding-top: 24px;
      }

      .logo {
        width: 210px;
      }

      .photo-container {
        width: 245px;
        height: 275px;
      }

      .identity h1 {
        font-size: 27px;
      }

      .identity p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <header class="header">

      <!--
        Coloca el logo oficial en la misma carpeta del HTML
        con el nombre: logo-hudson.png
      -->
      <img
        src="logo-hudson.png"
        alt="Hudson Products de México"
        class="logo"
      >

      <!--
        Coloca la fotografía con fondo transparente
        en la misma carpeta con el nombre: andrea-olmos.png
      -->
      <div class="photo-container">
        <img
          src="andrea-olmos.png"
          alt="Andrea Olmos"
          class="photo"
        >
      </div>

    </header>

    <section class="identity">
      <h1>Andrea Olmos</h1>
      <p>Sr Supply Chain Manager</p>
      <div class="accent"></div>
    </section>

    <section class="contact-list">

      <a
        class="contact-item"
        href="mailto:andrea.olmos@hpm.com.mx"
      >
        <div class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 4H4C2.9 4 2.01 4.9 2.01 6L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </div>

        <div class="contact-text">
          <span class="label">Correo</span>
          <span class="value">andrea.olmos@hpm.com.mx</span>
        </div>

        <span class="arrow">›</span>
      </a>

      <a
        class="contact-item"
        href="tel:+528115887963"
      >
        <div class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
        </div>

        <div class="contact-text">
          <span class="label">Teléfono</span>
          <span class="value">+52 81 1588 7963</span>
        </div>

        <span class="arrow">›</span>
      </a>

    </section>

    <div class="actions">

      <!--
        Crea un archivo llamado:
        andrea-olmos.vcf

        y colócalo en la misma carpeta.
      -->
      <a
        class="save-contact"
        href="andrea-olmos.vcf"
        download
      >
        Guardar contacto
      </a>

    </div>

    <footer class="footer">
      <div class="footer-text">
        People. Process. Progress.
      </div>
    </footer>

  </main>

</body>
</html>
